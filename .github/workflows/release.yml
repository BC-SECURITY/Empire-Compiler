name: Build and Publish Self-Contained Assemblies

on:
  pull_request:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build and release'
        required: true
        default: 'main'
      release_version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
      prerelease:
        description: 'Publish as a pre-release (betas); it is then not marked Latest'
        type: boolean
        default: false

jobs:
  # RunCOFF is platform-independent net40 IL: build it once here and hand the same bytes to every leg.
  build-runcoff:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Build RunCOFF
        run: |
          dotnet restore
          dotnet msbuild EmpireCompiler/EmpireCompiler.csproj -t:BuildPrebuiltRunCoff -p:Configuration=Release
          sha256sum EmpireCompiler/Data/Prebuilt/RunCoff.exe
        shell: bash

      - name: Upload RunCOFF
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-runcoff
          path: EmpireCompiler/Data/Prebuilt/RunCoff.exe
          if-no-files-found: error

  build:
    needs: build-runcoff
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]

    steps:
      - name: Set runtime env var
        run: |
          case ${{ matrix.os }} in
            ubuntu-24.04)
            echo "runtime=linux-x64" >> $GITHUB_ENV
            ;;
            ubuntu-24.04-arm)
            echo "runtime=linux-arm64" >> $GITHUB_ENV
            ;;
            macos-15)
            echo "runtime=osx-arm64" >> $GITHUB_ENV
            ;;
          esac

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Download prebuilt RunCOFF
        uses: actions/download-artifact@v4
        with:
          name: prebuilt-runcoff
          path: EmpireCompiler/Data/Prebuilt

      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build self-contained assembly
        run: |
          dotnet publish -c Release -r ${{ env.runtime }} --self-contained -p:SkipPrebuiltRunCoff=true -o ./publish/${{ env.runtime }}
          mv ./publish/${{ env.runtime }}/* ./EmpireCompiler/
        shell: bash

      - name: Git Archive All
        run: |
          python scripts/git_archive_all.py \
            --include "EmpireCompiler" \
            publish/EmpireCompiler-${{ env.runtime }}-${{ github.event.inputs.release_version }}.tgz
        shell: bash

      # Data/abi and Data/Prebuilt/RunCoff.exe are untracked build outputs written by MSBuild targets
      # (WriteAbiFile, BuildPrebuiltRunCoff). git_archive_all.py --include adds the EmpireCompiler
      # directory recursively via tarfile, so they are archived even though git does not track them.
      - name: Verify archive contains engine ABI and prebuilt RunCOFF
        run: |
          archive=publish/EmpireCompiler-${{ env.runtime }}-${{ github.event.inputs.release_version }}.tgz
          members=$(tar -tzf "$archive")
          # Here-string, not `echo | grep -q`: grep -q exits on the first match, echo then dies of
          # SIGPIPE on a long member list, and the runner's pipefail reports a present file as missing.
          for f in EmpireCompiler/Data/abi EmpireCompiler/Data/Prebuilt/RunCoff.exe; do
            grep -qE "(^|/)${f}$" <<<"$members" || { echo "::error::$f missing from $archive"; exit 1; }
          done
          sha256sum EmpireCompiler/Data/Prebuilt/RunCoff.exe 2>/dev/null || shasum -a 256 EmpireCompiler/Data/Prebuilt/RunCoff.exe
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EmpireCompiler-${{ env.runtime }}
          path: ./publish/EmpireCompiler-${{ env.runtime }}-${{ github.event.inputs.release_version }}.tgz
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./publish
          pattern: EmpireCompiler-*
          merge-multiple: true

      # RunCOFF is built once (build-runcoff) and shared, so every archive must carry identical bytes.
      - name: Verify RunCOFF is identical across legs
        run: |
          mkdir -p "$RUNNER_TEMP/runcoff"
          for a in publish/EmpireCompiler-*.tgz; do
            d="$RUNNER_TEMP/runcoff/$(basename "$a" .tgz)"
            mkdir -p "$d"
            tar -xzf "$a" -C "$d" --wildcards '*EmpireCompiler/Data/Prebuilt/RunCoff.exe'
          done
          archives=$(ls publish/EmpireCompiler-*.tgz | wc -l)
          sums=$(find "$RUNNER_TEMP/runcoff" -name RunCoff.exe -exec sha256sum {} + | tee /dev/stderr | awk '{print $1}')
          [ "$archives" -ge 1 ] && [ "$(echo "$sums" | grep -c .)" -eq "$archives" ] || { echo "::error::expected one RunCoff.exe per archive ($archives)"; exit 1; }
          [ "$(echo "$sums" | sort -u | wc -l)" -eq 1 ] || { echo "::error::RunCoff.exe differs across legs"; exit 1; }
        shell: bash

      - name: Create Git tag
        run: |
          git tag ${{ github.event.inputs.release_version }}
          git push origin ${{ github.event.inputs.release_version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: ./publish/*
          tag_name: ${{ github.event.inputs.release_version }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          make_latest: ${{ github.event.inputs.prerelease != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
